<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta medica</title>
</head>
<body>
    <center>
        <h2>Nova consulta</h2>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="indentificar" name="id" required><br><br>
            <input type="date" placeholder="data" name="data" required><br><br>
            <input type="text" placeholder="Nome do paciente" name="paciente" required><br><br>
            <input type="number" placeholder="seu peso" name="peso" required><br><br>
            <input type="number" placeholder="sua altura" name="altura" required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
