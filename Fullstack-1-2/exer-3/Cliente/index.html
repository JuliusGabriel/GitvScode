<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nota aluno</title>
</head>
<body>
    <center>
        <H1>Nota do Aluno</H1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificacao" name="id" required><br><br>
            <input type="text" placeholder="Nome do aluno" name="nome" required><br><br>
            <input type="number" placeholder="nota" name="nota1" required><br><br>
            <input type="number" placeholder="nota2" name="nota2" required><br><br>
            <input type="number" placeholder="nota3" name="nota3" required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
    </center>
</body>
</html>
