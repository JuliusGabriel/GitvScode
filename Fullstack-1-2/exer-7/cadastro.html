<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Login de Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div>
                <h1>Cadastro de Produto</h1>
                <p class="subtitulo">Preencha os dados do produto a baixo</p>
            </div>

            <button type="button" class="botao-sair" onclick="window.location.href='login.html'">Sair</button>
        </header>
        
        <form id="formProduto">
            <div class="campo">
                <label for="codigoBarras">Códigos de Barras</label>
                <input type="text" id="codigoBarras" placeholder="EX: 78472532" required>
            </div>

            <div class="campo">
                <label for="descricaoProduto">Descrição do produto</label>
                <input type="text" id="descricaoProduto" placeholder="Nomde do Produto" required>
            </div>
            
            <div class="grade-precos">
                <div class="campo">
                    <label for="precoCusto">Preço de Custo (R$)</label>
                    <input type="number" id="precoCusto" min="0.01" step="0.01" placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="precoVenda">Preço das Vendas</label>
                    <input type="number" id="precoVenda" min="0.01" step="0.01" placeholder="0.01" required>
                </div>
            </div>

            <div class="campo campo-margem">
                <label for="margemLucro">Margem sobre o custo</label>
                <input type="text" id="margemLucro" value="0,00%" readonly>
                <small>calculado automaticamente conforme os preços.</small>
            </div>

            <fieldset>
                <legend>Tipo de unidade</legend>

                <div class="opcoes-unidade">
                    <label cass="opcao">
                        <input type="radio" nome="unidade" value="UN" required>
                        <span>UN - unidade</span>
                    </label>

                    <label cass="opcao">
                        <input type="radio" nome="unidade" value="LT" required>
                        <span>LT - litro</span>
                    </label>

                    <label cass="opcao">
                        <input type="radio" nome="unidade" value="KG" required>
                        <span>KG - Quilograma</span>
                    </label>
                </div>
            </fieldset>

            <div class="botoes">
                <button type="submit" class="botao-principal">Cadastrar Produto</button>

                <button type="reset" class="botao-secundario">Limpar</button>
            </div>

            <p id="mensagemProduto"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
